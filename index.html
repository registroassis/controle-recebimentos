<style>
:root{
  --navy:#0f2a4d; --navy-2:#1d4274; --blue:#3a6db3; --blue-soft:#eaf1fb; --blue-soft-2:#d5e3f5;
  --bg:#f4f7fb; --card:#ffffff; --line:#e1e8f1; --ink:#13223a; --muted:#5d6d84;
  --gold:#b8913a;
  --ok:#17704a; --ok-bg:#e5f4ec; --warn:#9a5200; --warn-bg:#fff2de; --danger:#b3261e; --danger-bg:#fdeceb;
  --r:16px; --shadow:0 1px 2px rgba(15,42,77,.05),0 6px 20px rgba(15,42,77,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
a{color:inherit}

header.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.10);display:grid;place-items:center;border:1px solid rgba(255,255,255,.14)}
.brand small{display:block;opacity:.72;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand-logo{width:42px;height:42px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
nav.mainnav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav.mainnav a{color:#d3e0f2;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px}
nav.mainnav a.on,nav.mainnav a:hover{background:rgba(255,255,255,.12);color:#fff}
.sync{font-size:12.5px;display:flex;align-items:center;gap:7px;color:#c9d7ea;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#9fb3cc;flex:none}
.dot.ok{background:#4fd18d}.dot.warn{background:#f2b44c}.dot.err{background:#ff7b72}
.out{border:1px solid rgba(255,255,255,.25);background:transparent;color:#d3e0f2;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}
.out:hover{background:rgba(255,255,255,.1);color:#fff}
body.logged-out nav.mainnav, body.logged-out .sync, body.logged-out #bOut, body.logged-out .nav-sep{display:none}

main{max-width:1320px;margin:0 auto;padding:24px 24px 60px}
.banner{display:none;margin:0 0 18px;padding:12px 16px;border-radius:12px;font-size:14.5px;font-weight:500}
.banner.show{display:block}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--blue-soft);color:var(--navy-2)}
.banner.err{background:var(--danger-bg);color:var(--danger)}

h1.page{font-size:26px;letter-spacing:-.02em;margin:0 0 4px;font-weight:800;color:var(--navy)}
p.sub{margin:0 0 22px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{margin:0;font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.01em}
.card-h .tag{font-size:13px;color:var(--muted);font-weight:600}
.card-b{padding:12px 20px 16px}

/* Login */
.login{max-width:420px;margin:7vh auto 0;padding:32px 30px}
.login h1{margin:0 0 6px;font-size:24px;color:var(--navy)}
.login p{margin:0 0 22px;color:var(--muted);font-size:15px}
.fld{margin-bottom:16px}
.fld label{display:block;font-weight:700;color:var(--navy);margin-bottom:7px;font-size:14.5px}
.fld input{width:100%;height:54px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;background:#fff}
.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft-2)}
.lerr{color:var(--danger);font-weight:600;font-size:14.5px;min-height:20px;margin:-4px 0 12px}

/* Home */
.home-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cx-card{display:flex;flex-direction:column;gap:14px;padding:22px 20px 20px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s;min-height:200px;position:relative}
.cx-card:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 10px 28px rgba(15,42,77,.12)}
.cx-num{width:54px;height:54px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.cx-title{font-weight:800;font-size:20px;color:var(--navy);letter-spacing:-.01em;word-break:break-word}
.cx-stat{margin-top:auto;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.cx-stat b{color:var(--ink);font-size:19px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;position:absolute;top:18px;right:16px}
.pill.on{background:var(--ok-bg);color:var(--ok)}
.pill.off{background:var(--blue-soft);color:var(--navy-2)}
.home-links{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.qlink{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;box-shadow:var(--shadow)}
.qlink:hover{border-color:var(--blue)}
.qlink .ic{width:44px;height:44px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;color:var(--navy);flex:none}
.qlink b{display:block;color:var(--navy);font-size:16px}
.qlink span{font-size:13.5px;color:var(--muted)}

/* Caixa */
.cx-head{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;padding:11px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;color:var(--navy);text-decoration:none}
.back:hover{border-color:var(--blue)}
.cx-head h1{margin:0;font-size:28px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.cx-date{margin-left:auto;font-weight:600;color:var(--muted);text-transform:capitalize}
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:11px 18px;border-radius:10px;font-weight:700;color:var(--muted);font-size:15px}
.tabs button.on{background:var(--navy);color:#fff}
.cx-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:118px 1fr 150px;align-items:center;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.chip{height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;letter-spacing:-.01em;color:#1a2433;position:relative;border:1px solid rgba(0,0,0,.06)}
.chip.nota::before{content:"";position:absolute;left:8px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.08)}
.n20000{background:#e3d9cc}.n10000{background:#cfe0f2}.n5000{background:#ecd8b8}.n2000{background:#f6e7a6}
.n1000{background:#f2cdc6}.n500{background:#dcd0ea}.n200{background:#c8dbe6}
.chip.moeda{width:58px;height:58px;border-radius:50%;margin:0 auto;font-size:14px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.45)}
.m100{background:linear-gradient(135deg,#e9d18e,#cdd3db)}.m50{background:#d7dbe1}.m25{background:#e7cf8c}.m10{background:#e4c886}.m5{background:#dcae86}
.stepper{display:flex;align-items:center;gap:8px;justify-content:center}
.st{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--blue-soft);color:var(--navy);font-size:26px;font-weight:600;line-height:1;display:grid;place-items:center;flex:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.st:hover{background:var(--blue-soft-2)}
.st:active{transform:scale(.96)}
.qty{width:100%;max-width:150px;height:56px;border:1.5px solid var(--line);border-radius:12px;text-align:center;font-size:24px;font-weight:700;color:var(--ink);background:#fff}
.qty::placeholder{color:#b6c2d2}
.qty:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft-2)}
.qty.has{border-color:#9dbbe3;background:#fbfdff}
.sub-t{text-align:right;font-weight:700;font-size:18px;color:var(--muted)}
.sub-t.has{color:var(--navy)}
.sec-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:#fafcfe;border-radius:0 0 var(--r) var(--r);font-weight:600;color:var(--muted)}
.sec-foot b{color:var(--navy);font-size:18px}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:16px}
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px 22px 20px;box-shadow:0 10px 30px rgba(15,42,77,.22);border-top:3px solid var(--gold)}
.hero small{display:block;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero .big{font-size:42px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.1;word-break:break-word}
.hero .saved{font-size:13px;opacity:.75;margin-top:8px}
.res{padding:6px 20px 8px}
.res-l{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.res-l:last-child{border-bottom:0}
.res-l span{color:var(--muted)}
.res-l b{font-size:17px;color:var(--ink)}
.res-l.tot b{color:var(--navy);font-size:19px}
.btn{height:58px;border-radius:14px;border:0;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:0 18px}
.btn.pri{background:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.sec:hover{border-color:var(--blue)}
.btn.dan{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mbar{display:none}

/* Troco */
.troco{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:stretch}
.tr-in{padding:22px;display:flex;flex-direction:column;gap:18px}
.f label{display:block;font-weight:700;color:var(--navy);margin-bottom:8px;font-size:15px}
.money{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;background:#fff;height:72px;padding:0 18px}
.money:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft-2)}
.money span{font-size:22px;font-weight:700;color:var(--muted);margin-right:10px}
.money input{border:0;outline:none;flex:1;font-size:32px;font-weight:800;text-align:right;color:var(--ink);background:transparent;min-width:0}
.tr-out{border-radius:var(--r);padding:26px;display:flex;flex-direction:column;justify-content:center;min-height:280px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.tr-out.troco-ok{background:var(--navy);color:#fff;border-color:var(--navy)}
.tr-out.falta{background:var(--warn-bg);color:var(--warn);border-color:#f3d5a6}
.tr-out.exato{background:var(--ok-bg);color:var(--ok);border-color:#bfe3cf}
.tr-out small{font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.85}
.tr-out .val{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:10px 0 6px;word-break:break-word}
.tr-out .hint{font-size:15px;opacity:.85}
.comp{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.comp span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 11px;border-radius:10px;font-weight:700;font-size:14.5px}
.tr-out.idle{color:var(--muted)}
.tr-out.idle .val{color:#b9c5d4}

/* Tabelas */
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafcfe}
table.t td{padding:12px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
table.t tfoot td{font-weight:800;color:var(--navy);background:#fafcfe;border-top:1px solid var(--line)}
.link-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13.5px;color:var(--navy)}
.link-btn:hover{border-color:var(--blue)}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.det{background:#f8fbff}
.det-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:6px 0}
.det-grid div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.det-grid div b{display:block;font-size:15px;color:var(--navy)}
.det-grid div.z{opacity:.45}
small.mut{color:var(--muted)}

/* Painel */
.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}
.toolbar .f label{font-size:13px;margin-bottom:6px;color:var(--muted)}
.toolbar input,.toolbar select{height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15.5px;background:#fff;color:var(--ink)}
.toolbar .link-btn{height:48px;padding:0 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:18px 20px}
.kpi small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.kpi b{display:block;font-size:28px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.main{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.main small,.kpi.main span{color:#c6d5ea}.kpi.main b{color:#fff}
.adm-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
svg text{font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.names{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 20px}
.names label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.names input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15.5px}
.names input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft-2)}
.names-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 18px}
.names-foot .btn{width:auto;height:50px;font-size:16px}
.day{margin-bottom:18px}
.day-chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px 0}
.day-chips span{background:var(--blue-soft);color:var(--navy-2);font-size:13px;font-weight:700;padding:6px 10px;border-radius:9px}

.ov{position:fixed;inset:0;background:rgba(10,24,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:18px;max-width:460px;width:100%;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-size:21px;color:var(--navy)}
.modal p{margin:0 0 20px;color:var(--muted);font-size:15.5px}
.modal .mv{font-size:30px;font-weight:800;color:var(--navy);margin:-6px 0 18px}
.modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:14px 20px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lock.dis{pointer-events:none;opacity:.55}
#nomesCard{scroll-margin-top:96px}

@media (max-width:1180px){
  .home-grid{grid-template-columns:repeat(3,1fr)}
  .cx-layout{grid-template-columns:1fr}
  .side{position:static}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .adm-grid{grid-template-columns:1fr}
  .names{grid-template-columns:repeat(2,1fr)}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom));gap:14px;align-items:center;border-top:3px solid var(--gold);box-shadow:0 -8px 24px rgba(15,42,77,.25)}
  .mbar div{flex:1;min-width:0}.mbar small{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
  .mbar b{font-size:28px;font-weight:800;letter-spacing:-.02em}
  .mbar span{font-size:12.5px;opacity:.75;text-align:right}
  .has-mbar{padding-bottom:100px}
}
@media (max-width:760px){
  main{padding:16px 14px 50px}
  .top-in{padding:10px 14px}
  .home-grid{grid-template-columns:repeat(2,1fr)}

/* ===== Visual "Registro Assis - Caixas" ===== */
html{background:#f4f7fb}
body{background:linear-gradient(180deg,#eaf1fb 0,#f4f7fb 360px) no-repeat;min-height:100vh}
header.top{background:linear-gradient(180deg,#0a1f45,#0b2450);border-bottom:4px solid #1e6fe0}
.top-in{padding:12px 24px;gap:16px}
.brand{gap:14px}
.brand-logo{width:50px;height:50px;border-radius:50%;background:#fff;object-fit:cover;flex:none;box-shadow:0 0 0 2px #fff}
.brand-sep{width:1.5px;height:42px;background:rgba(255,255,255,.6);flex:none}
.brand small{font-size:12px;letter-spacing:.05em;opacity:.85}
.brand b{font-size:22px;font-weight:800}
nav.mainnav{gap:6px}
nav.mainnav a{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-size:16px;color:#e2ebf8}
nav.mainnav a.on{background:#1e5fd6;color:#fff;box-shadow:0 6px 16px rgba(30,95,214,.45)}
nav.mainnav a:not(.on):hover{background:rgba(255,255,255,.1)}
.nav-sep{width:1.5px;height:34px;background:rgba(255,255,255,.25);flex:none}
.sync{font-size:15px;font-weight:600}
.sync.ok #syncTxt{color:#4fd18d}
.out{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:12px;font-size:15px;border:1.5px solid rgba(255,255,255,.35);color:#fff}
.hero-home{position:relative;padding:4px 0 26px}
.hero-home h1{font-size:42px;font-weight:800;color:#0a1f45;letter-spacing:-.03em;margin:0 0 8px;position:relative}
.hero-home p{margin:0;font-size:17.5px;color:#33415a;position:relative}
.hero-home p .d{color:#1d4ea8;font-weight:700}
.hero-home .accent{display:block;width:110px;height:4px;border-radius:4px;background:#1e6fe0;margin-top:10px}
.edit-names{position:absolute;right:0;bottom:24px;background:#fff;border:1px solid #d5e3f5;color:#1d4ea8;font-weight:700;font-size:14px;padding:9px 14px;border-radius:10px;text-decoration:none;box-shadow:var(--shadow)}
.edit-names:hover{border-color:#1e6fe0}
.deco{position:absolute;right:230px;top:-30px;width:300px;opacity:.07;pointer-events:none}
.home-grid{gap:18px}
.cx-card{padding:0;gap:0;min-height:0;overflow:hidden;border-radius:18px;border:1px solid #e3e9f3;border-bottom:5px solid var(--cc);box-shadow:0 2px 4px rgba(15,42,77,.05),0 10px 24px rgba(15,42,77,.08)}
.k1{--cc:#0a1f45;--tc:#0a1f45}.k2{--cc:#1e6fe0;--tc:#0d3b8e}.k3{--cc:#22b8c8;--tc:#0d4a9e}.k4{--cc:#7b3fd1;--tc:#0a2a66}.k5{--cc:#7cc142;--tc:#0d4a9e}
.cx-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 0 10px}
.cx-tab{background:var(--tc);color:#fff;font-weight:800;font-size:30px;line-height:1;padding:11px 26px 11px 16px;border-radius:12px 4px 4px 14px;clip-path:polygon(0 0,100% 0,84% 100%,0 100%)}
.pill{position:static;font-size:12px;padding:6px 10px;white-space:nowrap}
.pill.off{background:#eaf1fb;color:#0a1f45}
.cx-mid{display:flex;align-items:center;gap:12px;padding:16px 16px 10px}
.cx-mid .reg{width:54px;height:46px;flex:none}
.cx-title{font-size:21px}
.cx-sub{font-size:13.5px;color:#5d6d84;margin-top:2px}
.cx-val{margin:4px 14px 12px;background:linear-gradient(180deg,#eef4fc,#e4edf9);border-radius:12px;text-align:center;font-size:28px;font-weight:800;padding:12px 6px;color:#0a1f45;letter-spacing:-.02em}
.cx-btn{margin:0 14px 16px;background:#0a1f45;color:#fff;border-radius:999px;height:46px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;transition:background .15s}
.cx-card:hover .cx-btn{background:#1e5fd6}
.home-links{gap:20px;margin-top:28px}

.qlink .chev{margin-left:auto;color:#1d4ea8;flex:none}

@media (max-width:760px){ .hero-home h1{font-size:30px} .edit-names{position:static;display:inline-block;margin-top:14px} .brand b{font-size:18px} .nav-sep{display:none} .cx-tab{font-size:24px} .cx-val{font-size:22px} }

/* ===== Fechamento de caixa ===== */
.fe-tools{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:18px}
.fe-tools .f label{font-size:13px;margin-bottom:6px;color:var(--muted);display:block;font-weight:700}
.fe-tools select,.fe-tools input{height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15.5px;background:#fff;color:var(--ink)}
.fe-tools .sp{flex:1}
.bt{height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;gap:8px}
.bt:hover{border-color:var(--blue)}
.bt.pri{background:#0a1f45;color:#fff;border-color:#0a1f45}
.bt.pri:hover{background:#1e5fd6;border-color:#1e5fd6}
.fe-wrap{overflow-x:auto}
table.fe{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
table.fe th{background:#0a1f45;color:#fff;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:10px 8px;text-align:right;font-weight:700;position:sticky;top:0}
table.fe th:first-child{text-align:left;border-radius:10px 0 0 0}
table.fe th:last-child{border-radius:0 10px 0 0}
table.fe th.dep{background:#1e5fd6}
table.fe td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}
table.fe td:first-child{text-align:left;font-weight:700;color:var(--navy)}
table.fe tbody tr{cursor:pointer}
table.fe tbody tr:hover td{background:#f3f7fd}
table.fe tr.vazio td{color:#aab6c6}
table.fe tr.vazio td:first-child{color:#7d8ba0}
table.fe td.dep{font-weight:800;color:#0a1f45;background:#eef4fc}
table.fe td.neg{color:var(--danger)!important}
table.fe td.cx{color:#5d6d84}
table.fe tfoot td{font-weight:800;color:#0a1f45;background:#eaf1fb;border-top:2px solid #0a1f45}
table.fe .z{color:#c2ccd9}
table.fe tr.hoje td:first-child{box-shadow:inset 4px 0 0 #1e6fe0}
.fe-act{color:#1e5fd6;font-weight:800;font-size:16px}
.fe-obs{display:block;font-size:11.5px;color:var(--muted);font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ovf{position:fixed;inset:0;background:rgba(10,24,45,.45);display:none;align-items:flex-start;justify-content:center;z-index:45;padding:24px 16px;overflow-y:auto}
.ovf.show{display:flex}
.fmodal{background:#fff;border-radius:20px;max-width:920px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
.fm-h{display:flex;align-items:center;gap:14px;padding:18px 24px;background:#0a1f45;color:#fff;border-bottom:4px solid #1e6fe0}
.fm-h h3{margin:0;font-size:20px}
.fm-h small{opacity:.8;display:block;font-size:13px}
.fm-h input[type=date]{height:42px;border-radius:10px;border:0;padding:0 10px;font-size:15px}
.fm-x{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;width:40px;height:40px;font-size:20px}
.fm-b{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;padding:22px 24px}
.fm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fm-f label{display:block;font-size:13px;font-weight:700;color:#0a1f45;margin-bottom:5px}
.fm-f label i{font-style:normal;font-weight:500;color:var(--muted)}
.fm-in{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;height:50px;padding:0 12px;background:#fff}
.fm-in:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft-2)}
.fm-in span{color:var(--muted);font-weight:700;margin-right:8px}
.fm-in input{border:0;outline:none;flex:1;min-width:0;font-size:19px;font-weight:700;text-align:right;background:transparent;color:var(--ink)}
.fm-in.bad{border-color:var(--danger);background:var(--danger-bg)}
.fm-f.menos label::before{content:"−  ";color:var(--danger);font-weight:800}
.fm-sep{grid-column:1/-1;border-top:1px dashed var(--line);margin:4px 0}
.fm-obs{grid-column:1/-1}
.fm-obs input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px}
.fm-side{display:flex;flex-direction:column;gap:12px}
.fm-dep{background:#0a1f45;color:#fff;border-radius:16px;padding:18px;border-top:3px solid var(--gold)}
.fm-dep small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:700}
.fm-dep b{display:block;font-size:32px;font-weight:800;margin-top:6px;letter-spacing:-.02em;word-break:break-word}
.fm-dep.neg b{color:#ffb4ae}
.fm-dep p{margin:8px 0 0;font-size:12.5px;opacity:.75;line-height:1.45}
.fm-mini{background:#eef4fc;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:700;color:#0a1f45}
.fm-mini span{color:var(--muted);font-weight:600}
.fm-foot{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#fafcfe}
.fm-foot .sp{flex:1}
.fm-foot .btn{width:auto;height:52px;padding:0 22px;font-size:16px}
.fe-print-h{display:none}

@media (max-width:560px){ .fm-grid{grid-template-columns:1fr} }

/* ============================================================

/*CALC-START*/
const NOTAS = [20000, 10000, 5000, 2000, 1000, 500, 200];
const MOEDAS = [100, 50, 25, 10, 5];

const MAX_QTD = 99999;

function brl(c) {
  c = Math.round(Number(c) || 0);
  const neg = c < 0; c = Math.abs(c);
  const reais = Math.floor(c / 100), cent = c % 100;
  return (neg ? '- ' : '') + 'R$ ' + String(reais).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + String(cent).padStart(2, '0');
}
function brlSemSimbolo(c) { return brl(c).replace('R$ ', ''); }
function rotulo(d) { return d >= 100 ? 'R$ ' + (d / 100) : 'R$ 0,' + String(d).padStart(2, '0'); }
function sanitizeQty(v) {
  const dig = String(v == null ? '' : v).replace(/\D/g, '').slice(0, 5);
  if (dig === '') return 0;
  return Math.min(MAX_QTD, parseInt(dig, 10));
}
function emptyQ() { const q = {}; ALL.forEach(d => q['d' + d] = 0); return q; }
function resumo(q) {
  let totalCedulas = 0, totalMoedas = 0, qtdNotas = 0, qtdMoedas = 0;
  NOTAS.forEach(d => { const n = q['d' + d] | 0; totalCedulas += n * d; qtdNotas += n; });
  MOEDAS.forEach(d => { const n = q['d' + d] | 0; totalMoedas += n * d; qtdMoedas += n; });
  return { totalCedulas, totalMoedas, total: totalCedulas + totalMoedas, qtdNotas, qtdMoedas };
}
function calcTroco(servico, pago) {
  const diff = pago - servico;
  if (diff > 0) return { tipo: 'troco', valor: diff };
  if (diff < 0) return { tipo: 'falta', valor: -diff };
  return { tipo: 'exato', valor: 0 };
}
function composicao(c) {
  const itens = [];
  for (const d of ALL) { const n = Math.floor(c / d); if (n > 0) { itens.push([d, n]); c -= n * d; } }
  return { itens, resto: c };
}
function centsFromDigits(str) {
  const dig = String(str || '').replace(/\D/g, '').replace(/^0+/, '').slice(0, 10);
  return dig === '' ? 0 : parseInt(dig, 10);
}
/* ---- Fechamento de caixa (mesmas contas da planilha) ---- */
const FECH_CAMPOS = [
  { k: 'ri', l: 'RI/TD/PJ', x: 'RI/TD/PJ', d: 'Total recebido no dia' },
  { k: 'troco', l: 'Troco', x: 'TROCO', d: 'Fundo de troco' },

  { k: 'creditoBancario', l: 'Crédito bancário', x: 'CRÉDITO BANCARIO' },
  { k: 'onr', l: 'ONR', x: 'ONR' },
  { k: 'pix', l: 'PIX', x: 'PIX' },
  { k: 'debito', l: 'Débito', x: 'DÉBITO' },
  { k: 'credito', l: 'Crédito', x: 'CRÉDITO' }
];
const FECH_EXTRAS = [
  { k: 'moedas', l: 'Moedas', x: 'MOEDAS', d: 'Moedas que ficam no caixa' },

];

const MAX_CENTS = 9999999999;
// "1.588,86" | "1588,86" | "1588.86" | "R$ 1.588" → centavos; "" → 0; inválido → null
function parseMoney(str) {
  let t = String(str == null ? '' : str).replace(/R\$|\s/g, '');
  if (t === '') return 0;
  if (!/^[\d.,]+$/.test(t)) return null;
  if (t.includes(',')) { if ((t.match(/,/g) || []).length > 1) return null; t = t.replace(/\./g, '').replace(',', '.'); }
  else if (/\.\d{1,2}$/.test(t) && (t.match(/\./g) || []).length === 1) { /* ponto decimal */ }
  else t = t.replace(/\./g, '');
  const v = Math.round(parseFloat(t) * 100);
  if (!Number.isFinite(v) || v < 0 || v > MAX_CENTS) return null;
  return v;
}
// VALOR DEPÓSITO = RI/TD/PJ − Troco − Cheque pré − Cheque próprio − Crédito bancário − ONR − PIX − Débito − Crédito
function calcDeposito(f) {
  return (f.ri | 0) - (f.troco | 0) - (f.chequePre | 0) - (f.chequeProprio | 0) - (f.creditoBancario | 0) - (f.onr | 0) - (f.pix | 0) - (f.debito | 0) - (f.credito | 0);
}
// CAIXA = Troco do dia + soma das moedas do mês até esse dia
function saldosCaixa(lista) {
  const ord = lista.slice().sort((a, b) => a.dia < b.dia ? -1 : a.dia > b.dia ? 1 : 0);
  let acc = 0; const out = {};
  ord.forEach(f => { acc += (f.moedas | 0); out[f.dia] = (f.troco | 0) + acc; });
  return out;
}
/*CALC-END*/

/* ============================================================
   UTILITÁRIOS

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const CX = [1, 2, 3, 4, 5];
function diaLocal(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hoje() { return diaLocal(Date.now()); }
function addDias(dia, n) { const [y, m, d] = dia.split('-').map(Number); return diaLocal(new Date(y, m - 1, d + n).getTime()); }
function fmtDia(dia, longo) {

}
function fmtHora(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function fmtInt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
function confirmar({ titulo, texto, valor = '', ok = 'Confirmar', perigo = false }) {

/* ============================================================
   ESTADO
   ============================================================ */
const S = { hoje: hoje(), cont: {}, nomes: {}, ready: false, mode: null, logged: false };
CX.forEach(n => { S.cont[n] = { q: emptyQ(), updatedAt: null }; S.nomes[n] = ''; });
const cxPadrao = n => 'Caixa ' + pad(n);
const cxName = n => S.nomes[n] || cxPadrao(n);
const docId = (dia, n) => dia + '_c' + n;

function normCont(id, d) {
  if (!d || typeof d !== 'object') return null;
  const caixa = Number(d.caixa);
  if (!CX.includes(caixa) || typeof d.dia !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.dia)) return null;
  const q = emptyQ(); const src = (d.q && typeof d.q === 'object') ? d.q : {};
  ALL.forEach(x => { const v = Number(src['d' + x]); q['d' + x] = Number.isFinite(v) && v > 0 ? Math.min(MAX_QTD, Math.floor(v)) : 0; });
  const updatedAt = Number.isFinite(Number(d.updatedAt)) ? Number(d.updatedAt) : null;
  return { id, caixa, dia: d.dia, q, updatedAt, ...resumo(q) }; // totais sempre recalculados a partir das quantidades
}
function normNomes(d) {
  const o = {}; CX.forEach(n => { const v = d && d['c' + n]; o[n] = typeof v === 'string' ? v.trim().slice(0, 40) : ''; }); return o;
}

/* ============================================================
   ARMAZENAMENTO
   Firebase (Firestore, tempo real) quando configurado; senão, local.
   Coleção "contagens": um documento por caixa por dia  →  2026-11-15_c3
   Documento "config/caixas": nomes dos caixas
   ============================================================ */
const Local = {
  subs: new Set(),
  read(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } },
  emit() { this.subs.forEach(f => f()); },
  watch(fn) { this.subs.add(fn); fn(); return () => this.subs.delete(fn); },
  subQuery(filter, cb) { return this.watch(() => { const all = this.read('rc_cont', {}); cb(Object.entries(all).map(([id, d]) => ({ id, d })).filter(x => x.d && filter(x.d))); }); },
  async write(id, body) { const all = this.read('rc_cont', {}); all[id] = body; localStorage.setItem('rc_cont', JSON.stringify(all)); this.emit(); },
  subNomes(cb) { return this.watch(() => cb(this.read('rc_nomes', {}))); },
  subFech(mes, cb) { return this.watch(() => { const all = this.read('rc_fech', {}); cb(Object.entries(all).map(([id, d]) => ({ id, d })).filter(x => x.d && x.d.mes === mes)); }); },
  async writeFech(id, body) { const all = this.read('rc_fech', {}); all[id] = body; localStorage.setItem('rc_fech', JSON.stringify(all)); this.emit(); },
  async delFech(id) { const all = this.read('rc_fech', {}); delete all[id]; localStorage.setItem('rc_fech', JSON.stringify(all)); this.emit(); },
  async writeNomes(o) { localStorage.setItem('rc_nomes', JSON.stringify(o)); this.emit(); }
};
window.addEventListener('storage', () => Local.emit());

const Back = {
  fb: null, // { auth, db, fns }
  configurado() { return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'COLE_AQUI' && FIREBASE_CONFIG.projectId; },
  async init() {
    if (!this.configurado()) {
      S.mode = 'local'; S.logged = true; return startApp();
    }
    S.mode = 'firebase';
    try {
      const [app, auth, fs] = await Promise.all([
        import(FIREBASE_SDK + 'firebase-app.js'),
        import(FIREBASE_SDK + 'firebase-auth.js'),
        import(FIREBASE_SDK + 'firebase-firestore.js')
      ]);
      const fapp = app.initializeApp(FIREBASE_CONFIG);
      this.fb = { auth: auth.getAuth(fapp), db: fs.getFirestore(fapp), A: auth, F: fs };
    } catch (e) {
      console.error(e);
      showBanner('err', 'Não foi possível carregar o Firebase. Verifique a internet e atualize a página.'); setSync('err');
      return;

  },
  async login(email, senha) { return this.fb.A.signInWithEmailAndPassword(this.fb.auth, email, senha); },
  async logout() { if (this.fb) await this.fb.A.signOut(this.fb.auth); },
  subDia(dia, cb, err) {
    if (S.mode === 'local') return Local.subQuery(d => d.dia === dia, cb);
    const F = this.fb.F; const q = F.query(F.collection(this.fb.db, 'contagens'), F.where('dia', '==', dia));
    return F.onSnapshot(q, s => cb(s.docs.map(x => ({ id: x.id, d: x.data() })), s.metadata), err);
  },
  subRange(de, ate, cb, err) {
    if (S.mode === 'local') return Local.subQuery(d => d.dia >= de && d.dia <= ate, cb);
    const F = this.fb.F; const q = F.query(F.collection(this.fb.db, 'contagens'), F.where('dia', '>=', de), F.where('dia', '<=', ate));
    return F.onSnapshot(q, s => cb(s.docs.map(x => ({ id: x.id, d: x.data() })), s.metadata), err);
  },
  async write(id, body) {
    if (S.mode === 'local') return Local.write(id, body);
    const F = this.fb.F; return F.setDoc(F.doc(this.fb.db, 'contagens', id), body);
  },
  subFech(mes, cb, err) {
    if (S.mode === 'local') return Local.subFech(mes, cb);
    const F = this.fb.F; const q = F.query(F.collection(this.fb.db, 'fechamentos'), F.where('mes', '==', mes));
    return F.onSnapshot(q, s => cb(s.docs.map(x => ({ id: x.id, d: x.data() }))), err);
  },
  async writeFech(id, body) {
    if (S.mode === 'local') return Local.writeFech(id, body);
    const F = this.fb.F; return F.setDoc(F.doc(this.fb.db, 'fechamentos', id), body);
  },
  async delFech(id) {
    if (S.mode === 'local') return Local.delFech(id);
    const F = this.fb.F; return F.deleteDoc(F.doc(this.fb.db, 'fechamentos', id));
  },
  subNomes(cb, err) {
    if (S.mode === 'local') return Local.subNomes(cb);
    const F = this.fb.F; return F.onSnapshot(F.doc(this.fb.db, 'config', 'caixas'), s => cb(s.exists() ? s.data() : {}), err);
  },
  async writeNomes(o) {
    if (S.mode === 'local') return Local.writeNomes(o);
    const F = this.fb.F; return F.setDoc(F.doc(this.fb.db, 'config', 'caixas'), o);
  }
};

/* ---------- assinatura dos dados ---------- */
let unsubs = [];
let unsubDia = null;
function startApp() {
  document.body.classList.remove('logged-out');
  stopApp();
  unsubs.push(Back.subNomes(d => { S.nomes = normNomes(d); onNomesChanged(); }, onSubError));
  subscribeHoje();
  S.ready = true;
  updateBanner(); setSync(S.mode === 'local' ? 'local' : 'ok');
  render();
}
function stopApp() {
  closeFechMes();
  unsubs.forEach(u => { try { u(); } catch (e) { } }); unsubs = [];
  if (unsubDia) { try { unsubDia(); } catch (e) { } unsubDia = null; }
  closeRange();
  S.ready = false;
}
function subscribeHoje() {
  if (unsubDia) unsubDia();
  const dia = S.hoje;
  unsubDia = Back.subDia(dia, docs => {
    if (dia !== S.hoje) return;
    CX.forEach(n => {
      if (busy(n)) return; // edição local ainda não gravada: mantém o que está sendo digitado
      const f = docs.find(x => x.id === docId(dia, n));
      const c = f ? normCont(f.id, f.d) : null;
      S.cont[n] = c ? { q: c.q, updatedAt: c.updatedAt } : { q: emptyQ(), updatedAt: null };
      W.last[n] = JSON.stringify(S.cont[n].q);
    });
    onHojeChanged();
  }, onSubError);
}
// virada do dia com o app aberto: começa uma contagem nova automaticamente
setInterval(async () => {
  if (!S.ready || hoje() === S.hoje) return;
  await Promise.all(CX.map(settle));
  S.hoje = hoje(); CX.forEach(n => { S.cont[n] = { q: emptyQ(), updatedAt: null }; W.last[n] = null; });
  subscribeHoje(); render();
}, 30000);

/* ---------- consulta por período (histórico / painel) ---------- */
const R = { key: null, unsub: null, docs: [], loaded: false };
function useRange(de, ate) {
  const key = de + '|' + ate;
  if (R.key === key) return;
  closeRange();
  R.key = key; R.loaded = false; R.docs = [];
  R.unsub = Back.subRange(de, ate, docs => {
    R.docs = docs.map(x => normCont(x.id, x.d)).filter(Boolean);
    R.loaded = true; onRangeChanged();
  }, onSubError);
}
function closeRange() { if (R.unsub) { try { R.unsub(); } catch (e) { } } R.unsub = null; R.key = null; R.docs = []; R.loaded = false; }

function onSubError(err) {
  console.error(err);
  const code = err && err.code;
  if (code === 'permission-denied') showBanner('err', 'Sem permissão para ler os dados. Saia e entre novamente.');
  else showBanner('err', 'A conexão com o banco de dados foi interrompida. Atualize a página.');
  setSync('err');
}
function onWriteError(e) {
  console.error(e);
  const code = e && e.code;
  if (code === 'permission-denied') toast('Sem permissão para salvar. Saia e entre novamente.');
  else toast('Não foi possível salvar agora. Verifique a internet — o valor será enviado assim que possível.');
  setSync('warn');
}

/* ---------- gravação automática (agrupa digitação; uma gravação por vez por caixa) ---------- */
const W = { timer: {}, pending: {}, count: {}, chain: {}, last: {}, dia: {} };
CX.forEach(n => { W.chain[n] = Promise.resolve(); W.count[n] = 0; });
function busy(n) { return !!W.pending[n] || W.count[n] > 0; }
function queueSave(n) {
  W.pending[n] = true; W.dia[n] = S.hoje; clearTimeout(W.timer[n]); setSync('saving');
  W.timer[n] = setTimeout(() => flush(n), 400);
}
function flush(n) {
  clearTimeout(W.timer[n]);
  if (!W.pending[n]) return W.chain[n];
  W.pending[n] = false; W.count[n]++;
  W.chain[n] = W.chain[n].then(async () => {
    const q = { ...S.cont[n].q }; const key = JSON.stringify(q); const dia = W.dia[n] || S.hoje;
    try {
      if (key !== W.last[n]) {
        const ts = Date.now();
        await Back.write(docId(dia, n), { caixa: n, dia, q, ...resumo(q), updatedAt: ts });
        W.last[n] = key; if (dia === S.hoje) { S.cont[n].updatedAt = ts; showSaved(n); }
      }
      if (!CX.some(x => W.pending[x])) setSync(S.mode === 'local' ? 'local' : 'ok');
    } catch (e) { onWriteError(e); }
    finally { W.count[n]--; }
  });
  return W.chain[n];
}
async function settle(n) { await flush(n); await W.chain[n]; }
window.addEventListener('beforeunload', e => { if (CX.some(busy)) { CX.forEach(flush); e.preventDefault(); e.returnValue = ''; } });

/* ============================================================
   STATUS
   ============================================================ */

/* ============================================================
   ROTAS
   ============================================================ */
let route = 'inicio', curCx = null, cxTab = 'contagem';
function parseRoute() {
  const h = (location.hash || '').replace('#', '');
  const m = h.match(/^caixa-([1-5])$/);
  if (m) return { r: 'caixa', n: Number(m[1]) };
  if (['troco', 'historico', 'admin', 'fechamento'].includes(h)) return { r: h };
  if (h === 'nomes') return { r: 'admin', nomes: true };
  return { r: 'inicio' };
}
function render() {
  if (!S.logged) return;
  const p = parseRoute();
  if (curCx && (p.r !== 'caixa' || p.n !== curCx)) flush(curCx);
  route = p.r; curCx = p.r === 'caixa' ? p.n : null;
  if (route !== 'historico' && route !== 'admin') closeRange();
  if (route !== 'fechamento') closeFechMes();
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.r === route || (route === 'caixa' && a.dataset.r === 'inicio')));
  const v = $('#view');
  if (route === 'caixa') renderCaixa(v, curCx);
  else if (route === 'troco') renderTrocoPage(v);
  else if (route === 'historico') renderHistorico(v);
  else if (route === 'fechamento') renderFechamento(v);
  else if (route === 'admin') { renderAdmin(v); if (p.nomes) setTimeout(() => { const c = $('#nomesCard'); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'start' }); $('#nm1').focus({ preventScroll: true }); } }, 60); }
  else renderInicio(v);
}
window.addEventListener('hashchange', () => { cxTab = 'contagem'; render(); window.scrollTo(0, 0); });

function onHojeChanged() {
  if (route === 'caixa') syncCaixaInputs(curCx);
  else if (route === 'inicio') renderInicio($('#view'));
  else if (route === 'admin' && admDia === S.hoje) renderAdminBody();
}
function onRangeChanged() {
  if (route === 'admin') renderAdminBody();
  else if (route === 'historico') renderHistLista();
}
function onNomesChanged() {
  if (route === 'fechamento') { renderFechamento($('#view')); return; }
  if (route === 'inicio') renderInicio($('#view'));
  else if (route === 'caixa') { const h = $('#cxNome'); if (h) h.textContent = cxName(curCx); }
  else if (route === 'admin') { renderAdminBody(); fillNomes(false); }
  else if (route === 'historico') { renderHistorico($('#view')); }
}

async function limpar(n) {
  const r = resumo(S.cont[n].q);

/* ============================================================
   CALCULADORA DE TROCO
   ============================================================ */
const TR = {};
function trocoHTML(id) {
  return `<div class="troco">
    <section class="card tr-in">
      <div class="f"><label for="${id}-s">Valor do serviço / atendimento</label><div class="money"><span>R$</span><input id="${id}-s" class="num" inputmode="numeric" autocomplete="off" placeholder="0,00"></div></div>
      <div class="f"><label for="${id}-p">Valor pago pelo cliente</label><div class="money"><span>R$</span><input id="${id}-p" class="num" inputmode="numeric" autocomplete="off" placeholder="0,00"></div></div>
      <button class="btn sec" id="${id}-x">Limpar valores</button>
    </section>
    <section class="tr-out idle" id="${id}-o" aria-live="polite"></section>
  </div>`;
}
function bindTroco(id) {
  const st = TR[id] || (TR[id] = { s: 0, p: 0 });
  const si = $('#' + id + '-s'), pi = $('#' + id + '-p');
  const show = () => { si.value = st.s ? brlSemSimbolo(st.s) : ''; pi.value = st.p ? brlSemSimbolo(st.p) : ''; out(); };
  const mask = (el, key) => {
    el.addEventListener('input', e => {
      let dig = el.value.replace(/\D/g, '');
      const prev = st[key] ? String(st[key]) : '';
      if (e.inputType === 'deleteContentBackward' && dig.replace(/^0+/, '') === prev) dig = prev.slice(0, -1);
      st[key] = centsFromDigits(dig);
      el.value = st[key] ? brlSemSimbolo(st[key]) : '';
      el.setSelectionRange(el.value.length, el.value.length);
      out();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); (el === si ? pi : si).focus(); } });
    el.addEventListener('focus', () => setTimeout(() => el.setSelectionRange(el.value.length, el.value.length), 0));
  };
  const out = () => {
    const o = $('#' + id + '-o');
    if (!st.s && !st.p) { o.className = 'tr-out idle'; o.innerHTML = `<small>Troco a devolver</small><div class="val num">R$ 0,00</div><div class="hint">Digite os valores — o cálculo é automático. Ex.: 49780 vira 497,80.</div>`; return; }
    const r = calcTroco(st.s, st.p);
    if (r.tipo === 'troco') {
      const c = composicao(r.valor);
      o.className = 'tr-out troco-ok';
      o.innerHTML = `<small>Troco a devolver</small><div class="val num">${brl(r.valor)}</div>
        <div class="hint num">Pago ${brl(st.p)} − serviço ${brl(st.s)}</div>
        <div class="comp num">${c.itens.map(([d, q]) => `<span>${q}× ${brl(d)}</span>`).join('')}${c.resto ? `<span>+ ${c.resto} centavo${c.resto > 1 ? 's' : ''}</span>` : ''}</div>`;
    } else if (r.tipo === 'falta') {
      o.className = 'tr-out falta';
      o.innerHTML = `<small>Falta receber</small><div class="val num">${brl(r.valor)}</div><div class="hint num">O cliente pagou ${brl(st.p)} e o serviço é ${brl(st.s)}. Não há troco.</div>`;
    } else {
      o.className = 'tr-out exato';
      o.innerHTML = `<small>Valor exato</small><div class="val num">Sem troco</div><div class="hint num">Pago ${brl(st.p)} = serviço ${brl(st.s)}</div>`;
    }
  };
  mask(si, 's'); mask(pi, 'p');
  $('#' + id + '-x').onclick = () => { st.s = 0; st.p = 0; show(); si.focus(); };
  show();
}
function renderTrocoPage(v) {
  v.innerHTML = `<h1 class="page">Calculadora de troco</h1><p class="sub">Só faz a conta — não grava nada.</p>${trocoHTML('pg')}`;
  bindTroco('pg'); setTimeout(() => $('#pg-s').focus(), 50);
}

function barsCaixa(per) {
  const W0 = 560, rowH = 46, lab = 140, right = 116, H0 = per.length * rowH + 6;
  const max = Math.max(1, ...per.map(p => p.total)); const bw = W0 - lab - right;
  const curtoNome = s => s.length > 16 ? s.slice(0, 15) + '…' : s;
  return `<svg viewBox="0 0 ${W0} ${H0}" width="100%" role="img" aria-label="Total recebido por caixa">
    ${per.map((p, i) => {
      const y = i * rowH + 8, h = 26, w = p.total / max * bw;
      return `<text x="0" y="${y + 18}" font-size="14" font-weight="700" fill="#0f2a4d">${esc(curtoNome(cxName(p.n)))}</text>
        <rect x="${lab}" y="${y}" width="${bw}" height="${h}" rx="6" fill="#eef3f9"/>
        ${w > 0 ? `<rect x="${lab}" y="${y}" width="${Math.max(3, w)}" height="${h}" rx="6" fill="#0f2a4d"/>` : ''}
        <text x="${W0}" y="${y + 18}" font-size="14" font-weight="700" fill="#13223a" text-anchor="end">${brl(p.total)}</text>`;
    }).join('')}
  </svg>`;
}
function cols7(d7) {
  const W0 = 480, H0 = 230, top = 26, bot = 34, gap = 14, n = d7.length, cw = (W0 - gap * (n - 1)) / n;
  const max = Math.max(1, ...d7.map(x => x[1])), ch = H0 - top - bot;
  const curto = c => c >= 100000 ? 'R$ ' + (c / 100000).toFixed(1).replace('.', ',') + ' mil' : brl(c).replace(',00', '');
  return `<svg viewBox="0 0 ${W0} ${H0}" width="100%" role="img" aria-label="Total dos últimos 7 dias">
    <line x1="0" x2="${W0}" y1="${top + ch}" y2="${top + ch}" stroke="#e1e8f1"/>
    ${d7.map(([dia, v], i) => {
      const x = i * (cw + gap), h = v / max * ch, last = i === n - 1;
      return `${v > 0 ? `<rect x="${x}" y="${top + ch - h}" width="${cw}" height="${h}" rx="6" fill="${last ? '#0f2a4d' : '#9dbbe3'}"/><text x="${x + cw / 2}" y="${top + ch - h - 7}" font-size="11.5" font-weight="700" fill="#13223a" text-anchor="middle">${curto(v)}</text>` : ''}
        <text x="${x + cw / 2}" y="${H0 - 12}" font-size="12.5" fill="${last ? '#0f2a4d' : '#5d6d84'}" font-weight="${last ? 800 : 600}" text-anchor="middle">${fmtDia(dia)}</text>`;
    }).join('')}
  </svg>`;
}

    </section>
    <p class="sub no-print" style="margin-top:12px">Valor depósito = RI/TD/PJ − Troco − Cheque pré − Cheque próprio − Crédito bancário − ONR − PIX − Débito − Crédito. Caixa = Troco + moedas acumuladas no mês. Clique em um dia para lançar ou editar.</p>`;
  box.querySelector('tbody').onclick = e => { const tr = e.target.closest('tr[data-dia]'); if (tr) abrirFech(n, tr.dataset.dia); };
}
function renderFechResumo(box) {
  const per = CX.map(n => { const { docs, saldos } = linhasCaixa(n); const t = somaFech(docs); const ult = docs.length ? docs.map(f => f.dia).sort().pop() : null; return { n, t, dias: docs.length, saldo: ult ? saldos[ult] : 0 }; });
  const g = somaFech(FM.docs);
  box.innerHTML = `
    <div class="kpis" id="feKpis">
      <div class="card kpi main"><small>Total RI/TD/PJ</small><b class="num">${brl(g.ri)}</b><span>5 caixas · ${nomeMes(FE.mes)}</span></div>
      <div class="card kpi"><small>Total depositado</small><b class="num">${brl(g.deposito)}</b><span>${FM.docs.length} lançamento(s)</span></div>
      <div class="card kpi"><small>PIX + cartões</small><b class="num">${brl(g.pix + g.debito + g.credito)}</b><span>PIX ${brl(g.pix)}</span></div>
      <div class="card kpi"><small>Moedas no mês</small><b class="num">${brl(g.moedas)}</b><span>despesas ${brl(g.despesas)}</span></div>
    </div>
    <section class="card">
      <div class="fe-print-h"><h2>FECHAMENTO DE CAIXA — RESUMO DOS CAIXAS — ${nomeMes(FE.mes)}</h2></div>
      <div class="fe-wrap"><table class="fe num">
        <thead><tr><th>Caixa</th><th>Dias</th>${FECH_CAMPOS.filter(c => c.k !== 'troco').map(c => `<th>${c.l}</th>`).join('')}<th class="dep">Valor depósito</th><th>Moedas</th><th>Despesas</th><th>Saldo caixa</th></tr></thead>
        <tbody>${per.map(p => `<tr data-cx="${p.n}"><td>${esc(cxName(p.n))}</td><td>${p.dias}</td>${FECH_CAMPOS.filter(c => c.k !== 'troco').map(c => `<td>${fmt0(p.t[c.k])}</td>`).join('')}<td class="dep ${p.t.deposito < 0 ? 'neg' : ''}">${brlSemSimbolo(p.t.deposito)}</td><td>${fmt0(p.t.moedas)}</td><td>${fmt0(p.t.despesas)}</td><td class="cx">${p.dias ? brlSemSimbolo(p.saldo) : '–'}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td><td>${FM.docs.length}</td>${FECH_CAMPOS.filter(c => c.k !== 'troco').map(c => `<td>${brlSemSimbolo(g[c.k])}</td>`).join('')}<td>${brlSemSimbolo(g.deposito)}</td><td>${brlSemSimbolo(g.moedas)}</td><td>${brlSemSimbolo(g.despesas)}</td><td></td></tr></tfoot>
      </table></div>
    </section>
    <p class="sub no-print" style="margin-top:12px">Clique em um caixa para ver os dias.</p>`;
  box.querySelector('tbody').onclick = e => { const tr = e.target.closest('tr[data-cx]'); if (tr) { FE.caixa = tr.dataset.cx; $('#feC').value = FE.caixa; syncFeButtons(); renderFechLista(); } };
}

/* ---------- lançamento de um dia ---------- */
function abrirFech(n, dia) {
  let ov = $('#ovF');
  if (!ov) { ov = document.createElement('div'); ov.className = 'ovf'; ov.id = 'ovF'; document.body.appendChild(ov); }
  const novoLivre = !dia;
  const existente = dia ? FM.docs.find(f => f.caixa === n && f.dia === dia) : null;
  // troco sugerido: o do último dia lançado deste caixa no mês; senão R$ 500,00
  const ant = FM.docs.filter(f => f.caixa === n && (!dia || f.dia < dia)).sort((a, b) => a.dia < b.dia ? 1 : -1)[0];
  const val = {}; FECH_KEYS.forEach(k => val[k] = existente ? existente[k] : 0);
  if (!existente) val.troco = ant ? ant.troco : 50000;
  const campo = (c, menos) => `<div class="fm-f ${menos ? 'menos' : ''}"><label for="fm_${c.k}">${c.l}${c.d ? ` <i>· ${c.d}</i>` : ''}</label><div class="fm-in"><span>R$</span><input id="fm_${c.k}" data-k="${c.k}" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${val[c.k] ? brlSemSimbolo(val[c.k]) : ''}"></div></div>`;
  ov.innerHTML = `<div class="fmodal" role="dialog" aria-modal="true">
    <div class="fm-h"><div><small>${esc(cxName(n))} · Fechamento de caixa</small><h3>${novoLivre ? 'Lançar dia' : esc(fmtDia(dia, true))}</h3></div>
      ${novoLivre ? `<input type="date" id="fmDia" value="${hoje()}">` : ''}
      <button class="fm-x" id="fmX" aria-label="Fechar">×</button></div>
    <div class="fm-b">
      <div class="fm-grid">
        ${campo(FECH_CAMPOS[0], false)}${campo(FECH_CAMPOS[1], true)}
        <div class="fm-sep"></div>
        ${FECH_CAMPOS.slice(2).map(c => campo(c, true)).join('')}
        <div class="fm-sep"></div>
        ${FECH_EXTRAS.map(c => campo(c, false)).join('')}
        <div class="fm-obs fm-f"><label for="fmObs">Observação <i>· opcional</i></label><input id="fmObs" maxlength="120" value="${esc(existente ? existente.obs : '')}"></div>
      </div>
      <div class="fm-side">
        <div class="fm-dep" id="fmDep"><small>Valor depósito</small><b class="num" id="fmDepV">R$ 0,00</b><p>RI/TD/PJ menos troco, cheques, crédito bancário, ONR, PIX, débito e crédito.</p></div>
        <div class="fm-mini num"><span>Caixa (saldo)</span><b id="fmCx">R$ 0,00</b></div>
        <div class="fm-mini num"><span>Total recebido</span><b id="fmRi">R$ 0,00</b></div>
      </div>
    </div>
    <div class="fm-foot">
      ${existente ? '<button class="btn sec" id="fmDel" style="color:var(--danger)">Excluir lançamento</button>' : ''}
      <span class="sp"></span>
      <button class="btn sec" id="fmCancel">Cancelar</button>
      <button class="btn pri" id="fmSave">Salvar fechamento</button>
    </div>
  </div>`;
  ov.classList.add('show');
  const inputs = $$('.fm-in input', ov);
  const lerValores = () => { const o = {}; let ok = true; inputs.forEach(i => { const c = parseMoney(i.value); i.parentElement.classList.toggle('bad', c === null); if (c === null) ok = false; o[i.dataset.k] = c || 0; }); return { o, ok }; };
  const diaAtual = () => novoLivre ? ($('#fmDia').value || '') : dia;
  const recalc = () => {
    const { o } = lerValores(); const dep = calcDeposito(o);
    $('#fmDepV').textContent = brl(dep); $('#fmDep').classList.toggle('neg', dep < 0); $('#fmRi').textContent = brl(o.ri);
    const d = diaAtual() || hoje();
    const outros = FM.docs.filter(f => f.caixa === n && f.dia !== d && f.dia.slice(0, 7) === d.slice(0, 7));
    $('#fmCx').textContent = brl(saldosCaixa(outros.concat([{ dia: d, troco: o.troco, moedas: o.moedas }]))[d]);
  };
  inputs.forEach((i, idx) => {
    i.addEventListener('input', recalc);
    i.addEventListener('focus', () => setTimeout(() => { if (document.activeElement === i) i.select(); }, 0));
    i.addEventListener('blur', () => { const c = parseMoney(i.value); if (c !== null) i.value = c ? brlSemSimbolo(c) : ''; recalc(); });
    i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); (inputs[idx + 1] || $('#fmObs')).focus(); } });
  });
  $('#fmObs').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); salvar(); } });
  if (novoLivre) $('#fmDia').addEventListener('change', recalc);
  const fechar = () => { ov.classList.remove('show'); ov.innerHTML = ''; document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape' && !$('#ov').classList.contains('show')) fechar(); };
  document.addEventListener('keydown', esc_);
  $('#fmX').onclick = fechar; $('#fmCancel').onclick = fechar;
  ov.onclick = e => { if (e.target === ov) fechar(); };
  const salvar = async () => {
    const { o, ok } = lerValores();
    if (!ok) { toast('Há valores inválidos (em vermelho). Use apenas números, ex.: 1.588,86'); return; }
    const d = diaAtual();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('Informe a data.'); return; }
    if (novoLivre && FM.docs.some(f => f.caixa === n && f.dia === d) && !(await confirmar({ titulo: 'Já existe lançamento nesse dia', texto: `${cxName(n)} já tem fechamento em ${fmtDia(d, true)}. Substituir pelos valores novos?`, ok: 'Substituir', perigo: true }))) return;
    const body = { caixa: n, dia: d, mes: d.slice(0, 7), obs: ($('#fmObs').value || '').trim().slice(0, 120), updatedAt: Date.now() };
    FECH_KEYS.forEach(k => body[k] = o[k]);
    const btn = $('#fmSave'); btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      await Back.writeFech(fechId(d, n), body);
      fechar(); toast(`Fechamento de ${fmtDia(d)} salvo · depósito ${brl(calcDeposito(body))}`);
      if (d.slice(0, 7) !== FE.mes) { FE.mes = d.slice(0, 7); const m = $('#feM'); if (m) m.value = FE.mes; useFechMes(FE.mes); }
    } catch (e) { onWriteError(e); btn.disabled = false; btn.textContent = 'Salvar fechamento'; }
  };
  $('#fmSave').onclick = salvar;
  if (existente) $('#fmDel').onclick = async () => {
    if (!(await confirmar({ titulo: 'Excluir este lançamento?', texto: `${cxName(n)} · ${fmtDia(dia, true)}. Os valores desse dia serão apagados.`, valor: 'Depósito ' + brl(existente.deposito), ok: 'Excluir', perigo: true }))) return;
    try { await Back.delFech(existente.id); fechar(); toast('Lançamento excluído.'); } catch (e) { onWriteError(e); }
  };
  recalc();
  (novoLivre ? $('#fmDia') : inputs[0]).focus();
}

/* ---------- exportar para Excel (mesmo formato da planilha) ---------- */
function carregarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('xlsx')); document.head.appendChild(s); });
}
function abaCaixa(XLSX, n) {
  const { docs } = linhasCaixa(n); const lista = docs.slice().sort((a, b) => a.dia < b.dia ? -1 : 1);
  const [y, m] = FE.mes.split('-').map(Number);
  const head = [MESES[m - 1]].concat(FECH_CAMPOS.map(c => c.x), ['VALOR DEPÓSITO', 'MOEDAS', 'DESPESAS', 'CAIXA', 'OBS']);
  const aoa = [['FECHAMENTO DE CAIXA — ' + cxName(n).toUpperCase() + ' — ' + nomeMes(FE.mes).toUpperCase()], [], head];
  lista.forEach(f => { const [yy, mm, dd] = f.dia.split('-').map(Number); aoa.push([(Date.UTC(yy, mm - 1, dd) - Date.UTC(1899, 11, 30)) / 86400000].concat(FECH_CAMPOS.map(c => f[c.k] / 100), [null, f.moedas / 100, f.despesas / 100, null, f.obs || ''])); });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const R0 = 4, R1 = 3 + lista.length; const money = '"R$" #,##0.00;[Red]-"R$" #,##0.00';
  for (let r = R0; r <= R1; r++) {
    ws['K' + r] = { t: 'n', f: `B${r}-C${r}-D${r}-E${r}-F${r}-G${r}-H${r}-I${r}-J${r}`, z: money };
    ws['N' + r] = { t: 'n', f: `C${r}+SUM(L$${R0}:L${r})`, z: money };
    ws['A' + r].z = 'dd/mm/yyyy';
    'BCDEFGHIJLM'.split('').forEach(col => { if (ws[col + r]) ws[col + r].z = money; });
  }
  if (lista.length) {
    const T = R1 + 1; ws['A' + T] = { t: 's', v: 'TOTAL' };
    'BDEFGHIJKLM'.split('').forEach(col => ws[col + T] = { t: 'n', f: `SUM(${col}${R0}:${col}${R1})`, z: money });
    ws['!ref'] = 'A1:O' + T;
  }
  ws['!cols'] = [12, 14, 11, 12, 13, 15, 13, 13, 12, 13, 16, 11, 11, 12, 28].map(w => ({ wch: w }));
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 14 } }];
  return ws;
}
async function exportarExcel() {
  if (!FM.loaded) return;
  let XLSX;
  try { XLSX = await carregarXLSX(); } catch (e) { toast('Não foi possível carregar o exportador. Verifique a internet.'); return; }
  const wb = XLSX.utils.book_new();
  const [y, m] = FE.mes.split('-').map(Number);
  let nome;
  if (FE.caixa === 'all') {
    const res = [['RESUMO DO FECHAMENTO DE CAIXA — ' + nomeMes(FE.mes).toUpperCase()], [], ['CAIXA', 'DIAS'].concat(FECH_CAMPOS.filter(c => c.k !== 'troco').map(c => c.x), ['VALOR DEPÓSITO', 'MOEDAS', 'DESPESAS'])];
    CX.forEach(n => { const { docs } = linhasCaixa(n); const t = somaFech(docs); res.push([cxName(n), docs.length].concat(FECH_CAMPOS.filter(c => c.k !== 'troco').map(c => t[c.k] / 100), [t.deposito / 100, t.moedas / 100, t.despesas / 100])); });
    const wsR = XLSX.utils.aoa_to_sheet(res); wsR['!cols'] = Array(13).fill({ wch: 15 });
    Object.keys(wsR).forEach(k => { if (/^[C-M]\d+$/.test(k) && Number(k.slice(1)) > 3) wsR[k].z = '"R$" #,##0.00;[Red]-"R$" #,##0.00'; });
    XLSX.utils.book_append_sheet(wb, wsR, 'Resumo');
    CX.forEach(n => XLSX.utils.book_append_sheet(wb, abaCaixa(XLSX, n), ('Caixa ' + pad(n))));
    nome = `FECHAMENTO CAIXAS - ${MESES[m - 1]} ${y}.xlsx`;
  } else {
    const n = Number(FE.caixa);
    XLSX.utils.book_append_sheet(wb, abaCaixa(XLSX, n), MESES[m - 1]);
    const extra = S.nomes[n] ? ' - ' + S.nomes[n].replace(/[\\/:*?"<>|]/g, '') : '';
    nome = `ATE - ${pad(n)} - FECHAMENTO CAIXA ${MESES[m - 1]} ${y}${extra}.xlsx`;
  }
  XLSX.writeFile(wb, nome);
  toast('Planilha gerada: ' + nome);
}

/* ============================================================
   INÍCIO
   ============================================================ */
Back.init();
</script>
